<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{login.title}"></title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/header.css">
    <link rel="stylesheet" href="/forms.css">
    <link rel="stylesheet" href="/accountPages.css">
    <link rel="stylesheet" href="/button.css">

</head>
<body>
<div th:replace="~{header :: mainHeader}"></div>

<div class="page">

    <h1 th:text="#{login.title}"></h1>

    <div class="form-card">

        <form th:action="@{/account/login}" method="post">

            <div class="group">
                <label th:text="#{field.username}"></label>
                <input type="text" name="username" th:placeholder="#{field.username}" class="input" required/>
            </div>

            <div class="group">
                <label th:text="#{field.password}"></label>
                <input type="password" name="password" th:placeholder="#{field.password}" class="input" required/>
            </div>

            <div class="button-group">
                <button type="submit" class="btn" th:text="#{action.login}"></button>
            </div>

        </form>

        <div th:if="${error}">
            <p th:text="${error}"></p>
        </div>

        <p class="small-link">
            <a th:href="@{/account/register}" th:text="#{action.register}"></a>
        </p>
    </div>

</div>
</body>
</html>
