<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{register.title}"></title>
    <link rel="stylesheet" href="/header.css">
    <link rel="stylesheet" href="/accountPages.css">
</head>
<body>
<div th:replace="~{header :: mainHeader}"></div>

<h1 th:text="#{register.title}"></h1>

<form th:action="@{/account/register}" th:object="${register}" method="post">
    <div class="input-form">
        <label th:text="#{field.username}"></label>
        <input type="text" th:field="*{username}" th:placeholder="#{field.username}" required/>

        <label th:text="#{field.password}"></label>
        <input type="password" th:field="*{password}" th:placeholder="#{field.password}" required/>

        <label th:text="#{field.role}"></label>
        <select th:field="*{role}">
            <option th:value="EMPLOYEE" th:text="#{role.user}"></option>
            <option th:value="MANAGER" th:text="#{role.admin}"></option>
        </select>

        <button type="submit" class="btn" th:text="#{action.register}"></button>
        <button type="reset" class="btn" th:text="#{action.cancel}"></button>
    </div>
</form>

<p>
    <a th:href="@{/account/login}" th:text="#{action.login}"></a>
</p>
</body>
</html>
