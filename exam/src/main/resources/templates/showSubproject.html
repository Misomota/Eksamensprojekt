<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{entity.subproject}"></title>
    <link rel="stylesheet" href="/overview.css">
    <link rel="stylesheet" href="/header.css">
    <link rel="stylesheet" href="/button.css">
</head>
<body>
<div th:replace="~{header :: mainHeader}"></div>

<main class="page">
<h1 th:text="#{entity.subproject}"></h1>
<a th:href="@{/OnTheDot/addSubproject(projectID=${projectID})}" class="btn" th:text="#{action.create} + ' ' + #{entity.subproject}"></a>

<a th:href="@{/OnTheDot/projects}" class="btn" th:text="#{action.back}"></a>

    <div th:if="${subprojects.isEmpty()}">
        <img th:src="#{item.empty.image}" alt="Empty Subproject">
    </div>


<table th:if="${!subprojects.isEmpty()}">
    <tr th:each="s : ${subprojects}">
        <td>
            <a th:href="@{/OnTheDot/task(subprojectID=${s.subprojectID})}" th:text="${s.subprojectName}"></a>
        </td>
        <td>
            <a th:href="@{/OnTheDot/editSubproject(subprojectID=${s.subprojectID}, projectID=${projectID})}" class="btn" th:text="#{action.edit}"></a>
            <form th:action="@{/OnTheDot/deleteSubproject}" method="post" style="display:inline;">
                <input type="hidden" name="subprojectID" th:value="${s.subprojectID}">
                <input type="hidden" name="projectID" th:value="${projectID}">
                <button type="submit" th:text="#{action.delete}"></button>
            </form>
        </td>
    </tr>
</table>
    </main>
</body>
</html>
