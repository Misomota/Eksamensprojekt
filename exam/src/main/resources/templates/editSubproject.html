<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{action.edit} + ' ' + #{entity.subproject}"></title>
    <link rel="stylesheet" href="/forms.css">
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/header.css">
</head>
<body>
<div th:replace="~{header :: mainHeader}"></div>

<div class="form-project">
    <h1 th:text="#{action.edit} + ' ' + #{entity.subproject}"></h1>

    <form class="form-card" th:action="@{/OnTheDot/editSubproject}" th:object="${subproject}" method="post">
        <input type="hidden" th:field="*{subprojectID}"/>
        <input type="hidden" name="projectID" th:value="${projectID}"/>

        <div class="group">
            <input th:field="*{subprojectName}" th:placeholder="#{field.name}" class="input" required/>
        </div>

        <div class="button-group">
            <button type="submit" class="btn" th:text="#{action.save}"></button>
            <a th:href="@{/OnTheDot/subproject(projectID=${projectID})}" class="btn" th:text="#{action.cancel}"></a>
        </div>
    </form>
</div>
</body>
</html>
