<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Task</title>
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/forms.css">
    <link rel="stylesheet" href="/header.css">
</head>
<body>
<header class="topbar">
    <a href="/OnTheDot/home" class="logo-link">
        <img src="/images/logo.PNG" alt="Logo" class="logo"></a>

    <h1> On The Dot</h1>

    <div class="right-items">
        <a href="https://github.com/Misomota/Eksamensprojekt" class="logo-link">
            <img src="/images/github.PNG" alt="Logo" class="logo"></a>

        <a href="/home" class="logout-link">Log Out</a>
    </div>
</header>

<h1>Create Task</h1>

<form th:action="@{/OnTheDot/addTask}" th:object="${task}" method="post">
    <div>
        <input th:field="*{taskName}" placeholder="Name of task" type="search" class="input" required>
        <input th:field="*{startDate}" placeholder="start date" type="search" class="input" required>
        <input th:field="*{deadline}" placeholder="deadline" type="search" class="input" required>
        <input th:field="*{timeEstimate}" placeholder="time estimation" type="search" class="input" required>
        <input th:field="*{resource}" placeholder="resource" type="search" class="input" required>

    </div>
    <div>
        <button type="submit" class="btn">create</button>
        <a th:href="@{/OnTheDot/task}" class="btn">Cancel</a>
    </div>
</form>
</body>
</html>
