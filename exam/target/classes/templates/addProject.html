<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{action.create} + ' ' + #{entity.project}"></title>
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/forms.css">
    <link rel="stylesheet" href="/header.css">
</head>
<body>

<div th:replace="~{header :: mainHeader}"></div>

<h1 th:text="#{action.create} + ' ' + #{entity.project}"></h1>

<form th:action="@{/OnTheDot/addProject}" th:object="${project}" method="post">
    <input th:field="*{projectID}" type="hidden">

    <div class="group">
        <input th:field="*{projectName}"
               th:placeholder="#{field.name}"
               class="input" required>
    </div>

    <div class="button-group">
        <button type="submit" class="btn" th:text="#{action.create}"></button>
        <a th:href="@{/OnTheDot/projects}" class="btn" th:text="#{action.cancel}"></a>
    </div>
</form>
</body>
</html>
