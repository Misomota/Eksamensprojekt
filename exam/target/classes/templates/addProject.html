<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create project</title>
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/forms.css">
    <link rel="stylesheet" href="/header.css">
</head>
<body>

<header class="topbar">
    <a href="/OnTheDot/projects" class="logo-link">
        <img src="/images/logo.PNG" alt="Logo" class="logo"></a>

    <h1> On The Dot</h1>

    <div class="right-items">
        <a href="https://github.com/Misomota/Eksamensprojekt" class="logo-link">
            <img src="/images/github.PNG" alt="Logo" class="logo"></a>

        <form action="/home" method="post">
            <button type="submit">Logout</button>
        </form>
    </div>
</header>

<h1>Create project</h1>

<form th:action="@{/OnTheDot/addProject}" th:object="${project}" method="post">
  <input th:field="*{projectID}" type="hidden">

  <div class="group">
    <input th:field="*{projectName}" placeholder="Name of project" type="search" class="input" required>
  </div>

    <div class="button-group">
  <button type="submit" class="btn">create</button>
  <a th:href="@{/OnTheDot/projects}" class="btn">Cancel</a>
    </div>
</form>
</body>
</html>
