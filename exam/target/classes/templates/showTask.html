<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{entity.task}"></title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/header.css">
    <link rel="stylesheet" href="/task.css">
    <link rel="stylesheet" href="/button.css">
</head>
<body>
<div th:replace="~{header :: mainHeader}"></div>

<div class="top-button-wrapper">
    <!-- Primær knap til venstre -->
    <div class="top-button-left">
        <a th:href="@{/OnTheDot/addTask(subprojectID=${subprojectID})}" class="btn"
           th:text="#{action.create} + ' ' + #{entity.task}"></a>
    </div>

    <!-- Sekundære knapper til højre -->
    <div class="top-button-right">
        <a th:href="@{/OnTheDot/ganttDiagram(subprojectID=${subprojectID})}" class="btn"
           th:text="#{gantt.diagram}"></a>

        <a th:href="@{/OnTheDot/subproject(projectID=${projectID})}" class="btn secondary"
           th:text="#{action.back}"></a>
    </div>
</div>


<table>
    <tr>
        <th th:text="#{entity.task}+'/'+#{field.name}"></th>
        <th th:text="#{field.startDate}"></th>
        <th th:text="#{field.deadline}"></th>
        <th th:text="#{field.timeEstimate}"></th>
        <th th:text="#{field.duration}"></th>
        <th th:text="#{field.personAssigned}"></th>
        <th th:text="#{field.actualTimeUsed}"></th>
        <th th:text="#{action.edit} + '/' + #{action.delete}"></th>
    </tr>

    <div th:if="${!tasks.isEmpty()}"></div>

    <tr th:each="t : ${tasks}">
        <td th:text="${t.taskName}"></td>
        <td th:text="${t.startDate}"></td>
        <td th:text="${t.deadline}"></td>
        <td th:text="${t.timeEstimate}"></td>
        <td th:text="${t.duration}"></td>
        <td th:text="${t.personAssigned}"></td>
        <td th:text="${t.actualTimeUsed}"></td>

        <td>
            <form th:action="@{/OnTheDot/deleteTask}" method="post" style="display:inline;">
                <input type="hidden" name="taskID" th:value="${t.taskID}">
                <input type="hidden" name="subprojectID" th:value="${subprojectID}">
                <button class="btn danger" type="submit" th:text="#{action.delete}"></button>
            </form>

            <a class="btn edit"
               th:href="@{/OnTheDot/editTask(taskID=${t.taskID}, subprojectID=${subprojectID})}"
               th:text="#{action.edit}">
            </a>
        </td>

    </tr>

</table>

<div th:if="${tasks.isEmpty()}">
    <img th:src="#{item.empty.image}" alt="Empty Task" width="150" height="150">
</div>

</body>
</html>
