<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tasks</title>
    <link rel="stylesheet" href="/task.css">
    <link rel="stylesheet" href="/header.css">
</head>
<body>

<header class="topbar">
    <a href="/OnTheDot/home" class="site-name-link">
        <img src="../images/logo.PNG" alt="Logo" class="logo">
    </a>

    <h1> On The Dot</h1>

    <a href="https://github.com/Misomota/Eksamensprojekt" class="logo-link">
        <img src="../images/github.PNG" alt="Logo" class="logo">
    </a>

    <a href="Account/login" class="logout-link">Log Out</a>
</header>

<a th:href="@{/OnTheDot/addTask}" class="btn">create</a>

<table>
    <tr>
        <th>Task</th>
        <th>Start date</th>
        <th>Deadline</th>
        <th>Resource</th>
        <th>Action</th>
    </tr>

    <tr th:each="t : ${task}">
        <td contenteditable="true" th:text="${t.taskName}">Task Name</td>
        <td contenteditable="true" th:text="${t.startDate}">Start Date</td>
        <td contenteditable="true" th:text="${t.deadline}">Deadline</td>
        <td contenteditable="true" th:text="${t.resource}">Task Name</td>
        <td>
            <form th:action="@{/OnTheDot/deleteTask}" method="post">
                <input type="hidden" name="id" th:value="${t.taskID}">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
