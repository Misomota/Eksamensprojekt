<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{register.title}"></title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/header.css">
    <link rel="stylesheet" href="/forms.css">
    <link rel="stylesheet" href="/accountPages.css">
    <link rel="stylesheet" href="/button.css">
</head>
<body>
<div th:replace="~{header :: mainHeader}"></div>

<div class="page">

    <h1 th:text="#{register.title}"></h1>

    <div class="form-card">

        <form th:action="@{/account/register}" th:object="${register}" method="post">

            <div class="group">
                <label th:text="#{field.username}"></label>
                <input type="text" th:field="*{username}" th:placeholder="#{field.username}" class="input" required/>
            </div>

            <div class="group">
                <label th:text="#{field.password}"></label>
                <input type="password" th:field="*{password}" th:placeholder="#{field.password}" class="input" required/>
            </div>

            <div class="group">
                <label th:text="#{field.role}"></label>
                <select th:field="*{role}" class="input" required>
                    <option th:value="USER" th:text="#{role.user}"></option>
                    <option th:value="ADMIN" th:text="#{role.admin}"></option>
                </select>
            </div>

            <div class="button-group">
                <button type="submit" class="btn" th:text="#{action.register}"></button>
            </div>

            <div th:if="${error}">
                <p th:text="${error}"></p>
            </div>

        </form>

        <div class="small-link">
            <a th:href="@{/account/login}" th:text="#{action.login}"></a>
        </div>

    </div>

</div>
</body>
</html>
