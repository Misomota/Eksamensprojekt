<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit project</title>
    <link rel="stylesheet" href="/forms.css">
    <link rel="stylesheet" href="/header.css">
    <link rel="stylesheet" href="/button.css">
</head>
<body>
<header class="topbar">
    <a href="/OnTheDot/projects" class="logo-link">
        <img src="/images/logo.PNG" alt="Logo" class="logo"></a>

    <h1> On The Dot</h1>

    <div class="right-items">
        <a href="https://github.com/Misomota/Eksamensprojekt" class="logo-link">
            <img src="/images/github.PNG" alt="Logo" class="logo"></a>

        <a th:href="@{/account/logout}">Sign Out</a>
    </div>
</header>

<h2>Edit project</h2>

<form th:action="@{/OnTheDot/editProject}" th:object="${project}" method="post">
    <input type="hidden" th:field="*{projectID}" />

    <div>
        <div class="group">
            <input th:field="*{projectName}" placeholder="Project name" type="text" class="input" required/>
        </div>

    </div>

    <div class="buttonRow">
        <button type="submit" class ="btn">Save</button>
        <a th:href="@{/OnTheDot/projects}" class="btn">Cancel</a>
    </div>
</form>
</body>
</html>
