<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{action.edit} + ' ' + #{entity.project}"></title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/forms.css">
    <link rel="stylesheet" href="/button.css">
    <link rel="stylesheet" href="/header.css">
</head>
<body>
<div th:replace="~{header :: mainHeader}"></div>

<div class="form-project">
    <h1 th:text="#{action.edit} + ' ' + #{entity.project}"></h1>

    <form class="form-card" th:action="@{/OnTheDot/editProject}" th:object="${project}" method="post">
        <input type="hidden" th:field="*{projectID}"/>

        <div class="group">
            <input th:field="*{projectName}" th:placeholder="#{field.name}" class="input" required/>
        </div>

        <div class="button-group">
            <button type="submit" class="btn" th:text="#{action.save}"></button>
            <a th:href="@{/OnTheDot/projects}" class="btn" th:text="#{action.cancel}"></a>
        </div>
    </form>
    <div class="errorText" th:if="${error}">
        <p th:text="${error}"></p>
    </div>
</div>
</body>
</html>
