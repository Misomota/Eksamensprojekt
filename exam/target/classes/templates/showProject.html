<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Projects</title>
    <link rel="icon" th:href="/images/Logo.PNG" type="image/png">
    <link rel="stylesheet" href="/button.css">
</head>
<body>
<h1>Projects</h1>
<a th:href="@{/OnTheDot/addProject}" class="button">create new project</a>

<div th:if="${projects.isEmpty()}" >
  <img src="/images/Logo.PNG" alt="No project added yet.">
  <h2>No projects found. Please click create to make your first project.</h2>
</div>

<table>
    <tr th:each="p : ${projects}">
        <td th:text="${p.projectName}"></td>
        <td>
            <form th:action="@{/OnTheDot/deleteProject}" method="post">
               <input type="hidden" name="projectID" th:value="${p.projectID}">
               <button type="submit">Delete</button>
           </form>
        </td>
    </tr>
</table>
</body>
</html>
