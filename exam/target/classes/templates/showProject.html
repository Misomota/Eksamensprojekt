<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="icon" th:href="/images/Logo.PNG" type="image/png">
    <link rel="stylesheet" href="/button.css">
</head>
<body>
<h1>Projects</h1>
<a th:href="@{/OnTheDot/addProject}" class="btn">create</a>

<div th:if="${project.isEmpty()}" >
  <img src="/images/Logo.PNG" alt="No project added yet.">
  <h2>You haven´t added any projects yet. Please click create to make your first project.</h2>
</div>

<table>
    <tr th:each="p : ${project}">
        <td>
        <a th:href="@{/OnTheDot/Project(projectID=${p.projectID})}"
           th:text="${p.projectName}"></a>

           <form th:action="@{/OnTheDot/deleteProject}" method="post">
               <input type="hidden" name="projectID" th:value="${p.projectID()}">
               <button type="submit">Delete</button>
           </form>
        </td>
    </tr>
</table>
</body>
</html>
